# Publishes the repository's static apps to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Titan Mindset is then served at https://<owner>.github.io/<repo>/titan-mindset/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude 'server/node_modules' --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          # GitHub Pages needs .well-known served for Android asset links; Jekyll would hide it, so disable Jekyll.
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
