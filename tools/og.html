<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo Black"; src: url("../assets/fonts/archivo-black.woff2") format("woff2"); }
  body { margin: 0; }
  #board { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, rgba(7,24,41,.94), rgba(23,69,127,.88)), repeating-linear-gradient(45deg, #17457f 0 18px, #103156 18px 36px); }
  .copy { position: absolute; left: 72px; top: 96px; width: 700px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: 20px; font-weight: 700; color: #ff9166; margin-bottom: 22px; }
  h1 { font-family: "Archivo Black", "Arial Black", sans-serif; font-weight: 400; font-size: 78px; line-height: 1.04; margin: 0 0 30px; letter-spacing: -.01em; }
  p { font-size: 28px; line-height: 1.4; color: #eef2f7; margin: 0; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 24px; font-weight: 700; color: #b9c7d8; letter-spacing: .04em; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #fa4616; }
  img { position: absolute; right: 40px; top: 170px; width: 440px; filter: drop-shadow(0 12px 28px rgba(0,0,0,.4)); }
</style></head>
<body><div id="board">
  <div class="copy">
    <div class="eyebrow">Mountain Crest High School &middot; Hyrum, Utah</div>
    <h1>Mountain Crest<br>Girls Wrestling</h1>
    <p>Five-time 4A state champions.<br>Grit &middot; Grace &middot; Gratitude</p>
  </div>
  <img src="../assets/img/logo.png" alt="">
  <div class="url">MCGirlsWrestling.com</div>
  <div class="bar"></div>
</div></body></html>
